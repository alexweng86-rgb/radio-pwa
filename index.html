<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Online Radio</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
          <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
        </svg>
        <h1>Online Radio</h1>
      </div>
      <div class="header-right">
        <div class="recording-badge" id="recordingBadge">
          <span class="rec-dot"></span>
          <span id="recordingTime">00:00</span>
        </div>
        <button class="btn-settings" id="settingsBtn" title="Настройки">
          <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
        </button>
      </div>
    </header>

    <div class="player-bar" id="playerBar">
      <div class="player-info">
        <div class="station-icon" id="stationIcon">
          <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
            <path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8c0-1.11-.89-2-2-2H8.3l8.26-3.34-.37-.91L3.24 6.15zM7 20a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm13-8h-2v-2h2v2z"/>
          </svg>
        </div>
        <div class="station-text">
          <div class="station-name" id="stationName">Выберите станцию</div>
          <div class="station-genre" id="stationGenre"></div>
          <div class="now-playing" id="nowPlaying">
            <span class="np-label">Сейчас играет:</span>
            <span class="np-track" id="npTrack">—</span>
          </div>
          <div class="buffer-info" id="bufferInfo">
            <div class="buffer-bar-wrap">
              <div class="buffer-bar-fill" id="bufferBarFill"></div>
            </div>
            <span class="buffer-text" id="bufferText"></span>
          </div>
        </div>
      </div>
      <div class="player-controls">
        <button class="btn-control" id="playBtn" disabled>
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" width="36" height="36">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="stopIcon" viewBox="0 0 24 24" fill="currentColor" width="36" height="36" style="display:none">
            <path d="M6 6h12v12H6z"/>
          </svg>
        </button>
        <button class="btn-record" id="recordBtn" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
            <circle cx="12" cy="12" r="8"/>
          </svg>
        </button>
      </div>
      <div class="volume-row">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" class="vol-icon">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8.5v7a4.49 4.49 0 0 0 2.5-3.5zM14 3.23v2.06a6.51 6.51 0 0 1 0 13.42v2.06A8.51 8.51 0 0 0 14 3.23z"/>
        </svg>
        <input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider">
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" class="vol-icon">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8.5v7a4.49 4.49 0 0 0 2.5-3.5zM14 3.23v2.06a6.51 6.51 0 0 1 0 13.42v2.06A8.51 8.51 0 0 0 14 3.23z"/>
        </svg>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="stations">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8c0-1.11-.89-2-2-2H8.3l8.26-3.34-.37-.91L3.24 6.15zM7 20a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm13-8h-2v-2h2v2z"/></svg>
        Станции
      </button>
      <button class="tab" data-tab="recordings">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15a.998.998 0 0 0-.98-.85c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08a6.993 6.993 0 0 0 5.91-5.78c.1-.6-.39-1.14-1-1.14z"/></svg>
        Записи
      </button>
      <button class="tab-btn" id="reorderBtn" title="Изменить порядок">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3 15h18v-2H3v2zm0 4h18v-2H3v2zm0-8h18V9H3v2zm0-6v2h18V5H3z"/></svg>
      </button>
    </div>

    <div class="content" id="content">
      <div class="tab-panel active" id="stationsPanel">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="searchInput" placeholder="Поиск станций...">
        </div>
        <div class="stations-list" id="stationsList"></div>
      </div>
      <div class="tab-panel" id="recordingsPanel">
        <div class="recordings-list" id="recordingsList">
          <div class="empty-state" id="emptyRecordings">
            <svg viewBox="0 0 24 24" fill="currentColor" width="64" height="64" style="opacity:0.2">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15a.998.998 0 0 0-.98-.85c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08a6.993 6.993 0 0 0 5.91-5.78c.1-.6-.39-1.14-1-1.14z"/>
            </svg>
            <p>Нет записей</p>
            <p class="hint">Запускайте радио и нажимайте кнопку записи</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-modal">
      <div class="settings-header">
        <h2>Настройки</h2>
        <button class="settings-close" id="settingsClose">&times;</button>
      </div>
      <div class="settings-body">
        <div class="settings-section">
          <h3>Папка для записей</h3>
          <p class="settings-desc">Выберите папку на устройстве для сохранения записей радио.</p>
          <div class="settings-path" id="settingsPath">Текущая: IndexedDB (внутреннее хранилище)</div>
          <div class="settings-actions">
            <button class="btn-settings-primary" id="settingsChooseFolder">Выбрать папку</button>
            <button class="btn-settings-danger" id="settingsResetFolder">Сбросить</button>
          </div>
        </div>
        <div class="settings-section">
          <h3>Громкость по умолчанию</h3>
          <input type="range" id="settingsVolume" min="0" max="100" value="80" class="volume-slider">
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
